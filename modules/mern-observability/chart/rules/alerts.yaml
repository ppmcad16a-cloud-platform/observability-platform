# Every alert carries the cloud + cluster labels automatically
# (Prometheus externalLabels), so Slack shows WHERE it happened.
groups:
  - name: mern-alerts
    rules:
      - alert: MernServiceDown
        expr: kube_deployment_status_replicas_available{namespace="mern"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.deployment }} has NO ready pods"
          description: "No ready pods for {{ $labels.deployment }} for 2 minutes: this cloud cannot serve it. Cloudflare sends shoppers to the other clouds if /api/health fails."

      - alert: MernServiceDegraded
        expr: kube_deployment_status_replicas_available{namespace="mern"} < kube_deployment_spec_replicas{namespace="mern"}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.deployment }} runs with fewer pods than wanted"
          description: "{{ $labels.deployment }} has had missing pods for 10 minutes (crash loop, image pull problem or no room on the nodes)."

      - alert: MernHighErrorRate
        expr: mern:http_errors:ratio5m > 0.05 and on (service) sum by (service) (mern:http_requests:rate5m) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: {{ $value | humanizePercentage }} of requests fail with 5xx"
          description: "More than 5 % of {{ $labels.service }}'s requests have failed for 5 minutes."

      - alert: MernSlowResponses
        expr: mern:http_request_duration_seconds:p95_5m > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is slow: 95 % of requests take up to {{ $value | humanizeDuration }}"
          description: "The 95th percentile response time of {{ $labels.service }} has been above 1 second for 10 minutes."

      - alert: MernPodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="mern"}[15m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pod }} restarted {{ $value | humanize }} times in 15 minutes"
          description: "Container {{ $labels.container }} keeps restarting - check its logs in Grafana (MERN logs dashboard)."
