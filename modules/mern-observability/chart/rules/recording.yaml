groups:
  - name: mern-recording
    interval: 30s
    rules:
      # Requests per second, per service and status class (2xx/4xx/5xx).
      # The two service families name their metric differently; both are
      # combined ("or") under ONE name, so dashboards and alerts need one query.
      #   Node.js + Python services: http_request_duration_seconds (label status_code)
      #   Java identity-service:     http_server_requests_seconds  (label status)
      # Health checks are left out: Cloudflare's /api/health answers 503 on purpose
      # when a backend is down - that is MernServiceDown's job, not a "failed request".
      - record: mern:http_requests:rate5m
        expr: |
          sum by (service, code_class) (
            label_replace(
              rate(http_request_duration_seconds_count{namespace="mern", route!~"(/api)?/(health|ready|metrics)"}[5m]),
              "code_class", "${1}xx", "status_code", "([0-9]).*")
            or
            label_replace(
              rate(http_server_requests_seconds_count{namespace="mern", uri!~"/(health|ready|actuator.*)"}[5m]),
              "code_class", "${1}xx", "status", "([0-9]).*")
          )

      # Share of requests that failed with a 5xx (0.05 = 5 %).
      - record: mern:http_errors:ratio5m
        expr: |
          (sum by (service) (mern:http_requests:rate5m{code_class="5xx"}) or sum by (service) (mern:http_requests:rate5m) * 0)
            / sum by (service) (mern:http_requests:rate5m)

      # 95 % of requests are faster than this (seconds). Node.js + Python;
      # identity-service has no latency buckets (Spring default).
      - record: mern:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket{namespace="mern", route!~"(/api)?/(health|ready|metrics)"}[5m])))
